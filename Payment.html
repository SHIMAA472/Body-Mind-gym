<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="GymFit payment page">
  <meta name="theme-name" content="gymfit" />
  <meta name="author" content="Themefisher.com">
  <title>Body Mind | Secure Payment</title>
  <!-- bootstrap.min css -->
  <link rel="stylesheet" href="plugins/bootstrap/css/bootstrap.min.css">
  <!-- Icofont Css -->
  <link rel="stylesheet" href="plugins/icofont/icofont.min.css">
  <!-- Themify Css -->
  <link rel="stylesheet" href="plugins/themify/css/themify-icons.css">
  <!-- animate.css -->
  <link rel="stylesheet" href="plugins/animate-css/animate.css">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation copied from main site -->
  <nav class="navbar navbar-expand-lg navigation fixed-top" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <h2 class="text-white text-capitalize">Body Mind<span class="text-color">GYm</span></h2>
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsid"
        aria-controls="navbarsid" aria-expanded="false" aria-label="Toggle navigation">
        <span class="ti-view-list"></span>
      </button>
      <div class="collapse text-center navbar-collapse" id="navbarsid">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="pricing.html">Membership</a></li>
          <li class="nav-item active"><a class="nav-link" href="#">Payment <span class="sr-only">(current)</span></a></li>
        </ul>
        <div class="my-md-0 ml-lg-4 mt-4 mt-lg-0 ml-auto text-lg-right mb-3 mb-lg-0">
          <a href="tel:+970594869725"><h3 class="text-color mb-0"><i class="ti-mobile mr-2"></i>+970 59 486 9725</h3></a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Payment Section -->
  <section class="section pt-120" style="min-height:80vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow border-0 p-4">
            <h3 class="mb-4 text-center">Secure Payment</h3>
            <form id="paymentForm" novalidate>
              <div class="form-group">
                <label for="name">Cardholder Name</label>
                <input type="text" class="form-control" id="name" placeholder="Full name" required>
              </div>
              <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" class="form-control" id="cardNumber" placeholder="XXXX XXXX XXXX XXXX" pattern="[0-9]{16}" required>
              </div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="expiry">Expiry Date</label>
                  <input type="text" class="form-control" id="expiry" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/([0-9]{2})" required>
                </div>
                <div class="form-group col-6">
                  <label for="cvv">CVV</label>
                  <input type="password" class="form-control" id="cvv" placeholder="123" pattern="[0-9]{3}" required>
                </div>
              </div>
              <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label" for="terms">I agree to the <a href="#">terms &amp; conditions</a></label>
              </div>
              <button type="submit" class="btn btn-main btn-block">Pay Now</button>
              <div id="paymentSuccess" class="alert alert-success mt-3 d-none" role="alert">
                Payment Successful. Thank you for your purchase!
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer copied from main site -->
  <footer class="footer bg-black-50">
    <div class="container">
      <div class="row align-items-center mt-5 px-3 bg-black mx-1">
        <div class="col-lg-6">
          <p class="text-white mt-3 mb-0">Body Mind Gym © 2025</p>
        </div>
        <div class="col-lg-6 text-lg-right">
          <ul class="list-inline mb-0 footer-socials">
            <li class="list-inline-item"><a href="#"><i class="ti-facebook"></i></a></li>
            <li class="list-inline-item"><a href="#"><i class="ti-twitter"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="plugins/jquery/jquery.js"></script>
  <script src="plugins/bootstrap/js/bootstrap.min.js"></script>
  <script>
    // Simple client-side validation feedback and success message
    (function(){
      'use strict';
      var form = document.getElementById('paymentForm');
      var successMsg = document.getElementById('paymentSuccess');
      form.addEventListener('submit', function(event){
        if(!form.checkValidity()){
          event.preventDefault();
          event.stopPropagation();
        } else {
          event.preventDefault(); // prevent actual submission for demo
          successMsg.classList.remove('d-none');
          form.reset();
          form.classList.remove('was-validated');
        }
        form.classList.add('was-validated');
      }, false);
    })();
  </script>
</body>
</html>
