  <link rel="stylesheet" href="plugins/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="plugins/icofont/icofont.min.css">
  <link rel="stylesheet" href="plugins/themify/css/themify-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <a class="navbar-brand" href="index.html">
      <h2 class="text-white text-capitalize">Body Mind<span class="text-color">GYm</span></h2>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsid"
            aria-controls="navbarsid" aria-expanded="false" aria-label="Toggle navigation">

    </button>

      <ul class="navbar-nav mx-auto">

<!-- ======= BOOKING FORM ======= -->
<section class="section pt-120" style="min-height:80vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow border-0 p-4">
          <h3 class="text-center mb-4">Book Your Class</h3>

          <form id="bookingForm" novalidate>
            <!-- Member Name -->
            <div class="form-group">
              <label for="memberName">Your Name</label>
              <input type="text" id="memberName" class="form-control" placeholder="Full name" required>
            </div>

            <!-- Class -->
            <div class="form-group">
              <label for="classType">Class</label>
              <select id="classType" class="form-control" required>
                <option value="" disabled selected>Select class</option>
                <option value="Yoga">Yoga</option>
                <option value="HIIT">Fitness</option>
                <option value="Pilates">WEIGHT LIFTING</option>
                <option value="Cardio Burn">Cycling</option>
                <option value="Cardio Burn"> Building body</option>
                <option value="Cardio Burn">Fitness Track</option>
              </select>
            </div>

            <!-- Trainer -->
            <div class="form-group">
              <label for="trainer">Trainer</label>
              <select id="trainer" class="form-control" required>
                <option value="" disabled selected>Select trainer</option>
                <option value="Omar Mansour">Ashley</option>
                <option value="Sara Darwish">Alexander</option>
                <option value="Sara Darwish">Jacqueline</option>
                <option value="Sara Darwish">Jay</option>
                <option value="Sara Darwish">Jessica</option>
                <option value="Sara Darwish">Arthur</option>
              </select>
            </div>

            <!-- Date & Time -->
            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="classDate">Date</label>
                <input type="date" id="classDate" class="form-control" required>
              </div>
              <div class="form-group col-md-6">
                <label for="classTime">Time</label>
                <input type="time" id="classTime" class="form-control" required>
              </div>
            </div>

            <button class="btn btn-main btn-block" type="submit">Reserve Spot</button>

            <div id="bookOk" class="alert alert-success mt-3 d-none">Booking confirmed!</div>
          </form>
        </div>
      </div>
    </div>

    <!-- ======= CURRENT BOOKINGS TABLE ======= -->
    <div class="row justify-content-center mt-5">
      <div class="col-lg-10">
        <h4 class="mb-3 text-center">My Bookings</h4>
        <div class="table-responsive">
          <table class="table table-striped table-bordered" id="bookingTable">
            <thead class="thead-dark">
              <tr>
                <th>#</th><th>Class</th><th>Trainer</th><th>Date</th><th>Time</th><th>Action</th>
              </tr>
            </thead>
            <tbody><!-- dynamic rows --></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ======= FOOTER ======= -->
<footer class="footer bg-black-50">
  <div class="container">
    <div class="row align-items-center mt-5 px-3 bg-black mx-1">
      <div class="col text-center">
        <p class="text-white mt-3 mb-0">Body Mind Gym © 2020</p>
      </div>
    </div>
  </div>
</footer>

<!-- ======= SCRIPTS ======= -->
<script src="plugins/jquery/jquery.js"></script>
<script src="plugins/bootstrap/js/bootstrap.min.js"></script>
<script>
  /* ==== BOOKING LOGIC ==== */
  (() => {
    'use strict';
    const form       = document.getElementById('bookingForm');
    const bookOk     = document.getElementById('bookOk');
    const tableBody  = document.querySelector('#bookingTable tbody');

    /* helpers */
    const getBookings = () => JSON.parse(localStorage.getItem('bm_bookings') || '[]');
    const setBookings = data => localStorage.setItem('bm_bookings', JSON.stringify(data));

    /* render bookings in table */
    function renderTable() {
      tableBody.innerHTML = '';
      const bookings = getBookings();
      bookings.forEach((b, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${i + 1}</td>
          <td>${b.classType}</td>
          <td>${b.trainer}</td>
          <td>${b.date}</td>
          <td>${b.time}</td>
          <td><button class="btn btn-sm btn-danger" data-id="${i}">Cancel</button></td>`;
        tableBody.appendChild(row);
      });
    }

    /* submit booking */
    form.addEventListener('submit', e => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
        form.classList.add('was-validated');
        return;
      }
      e.preventDefault();

      const bookings = getBookings();
      bookings.push({
        member   : document.getElementById('memberName').value.trim(),
        classType: document.getElementById('classType').value,
        trainer  : document.getElementById('trainer').value,
        date     : document.getElementById('classDate').value,
        time     : document.getElementById('classTime').value
      });
      setBookings(bookings);

      bookOk.classList.remove('d-none');
      form.reset();
      form.classList.remove('was-validated');
      renderTable();

      setTimeout(() => bookOk.classList.add('d-none'), 2000);
    });

    /* cancel booking */
    tableBody.addEventListener('click', e => {
      if (e.target.matches('button[data-id]')) {
        const id = +e.target.dataset.id;
        const bookings = getBookings();
        bookings.splice(id, 1);
        setBookings(bookings);
        renderTable();
      }
    });

    /* init */
    renderTable();
  })();
</script>
</body>
</html>
